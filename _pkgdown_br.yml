url: https://onelsoncarvalho.github.io/amazonasdatahub/br
template:
  bootstrap: 5

articles:
  - title: "Agropecuária"
    desc: "Dados sobre produção agrícola e pecuária no estado do Amazonas."
    contents:
      - br/agriculture_amazonas

  - title: "Saúde"
    desc: "Indicadores epidemiológicos de notificações de infecções e agravos em saúde."
    contents:
      - br/aids_amazonas
      - br/malaria_amazonas

  - title: "Economia"
    desc: "Séries temporais/indicadores do Produto Interno Bruto (PIB) do Amazonas."
    contents:
      - br/gdp_amazonas

  - title: "Clima e Meio Ambiente"
    desc: "Dados meteorológicos, umidade do ar em Manaus e cota dos níveis de rios."
    contents:
      - br/humidity_manaus

  - title: "Meio Ambiente"
    desc: 'Cota dos nível do Rio Negro'
    contents:
      - br/rionegro_amazonas

  - title: "Segurança Rodoviária"
    desc: "Registros e ocorrências de acidentes de trânsito"
    contents:
      - br/prf_amazonas

  - title: "Educação"
    desc: "Pesquisas de desempenho escolar e letramento físico no ambiente educacional"
    contents:
      - br/srl_muni

navbar:
  structure:
    left: [intro, articles]
    right: [language, github]
  components:
    intro:
      text: "Início"
      href: "index.html"
    articles:
      text: "Bases de Dados"
      href: "articles/index.html"
      menu:
        - text: "Visão Geral (Todas as bases de dados)"
          href: "articles/index.html"
        - text: "----------------"
        - text: "agriculture_amazonas"
          href: "articles/br/agriculture_amazonas.html"
        - text: "aids_amazonas"
          href: "articles/br/aids_amazonas.html"
        - text: "gdp_amazonas"
          href: "articles/br/gdp_amazonas.html"
        - text: "humidity_manaus"
          href: "articles/br/humidity_manaus.html"
        - text: "malaria_amazonas"
          href: "articles/br/malaria_amazonas.html"
        - text: "prf_amazonas"
          href: "articles/br/prf_amazonas.html"
        - text: "rionegro_amazonas"
          href: "articles/br/rionegro_amazonas.html"
        - text: "srl_muni"
          href: "articles/br/srl_muni.html"
    language:
